# Alternative to Caddy: nginx in front of the container (published on 127.0.0.1:8787).
# Certificates from certbot; adjust paths and server_name. Run the app with
#   ALLOWED_ORIGINS=https://duel.example.com TRUST_PROXY=true
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name duel.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name duel.example.com;

    ssl_certificate     /etc/letsencrypt/live/duel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duel.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /metrics { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # WebSocket upgrade for /ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Games can sit quietly between rounds; the server pings every 30 s.
        proxy_read_timeout 120s;
    }
}
